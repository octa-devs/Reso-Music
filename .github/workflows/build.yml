name: Build Reso Music Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Generate Debug Keystore & Properties
        run: |
          keytool -genkeypair -v -keystore keystore.jks -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          cp keystore.jks app/keystore.jks
          cat <<EOF > keystore.properties
          storeFile=keystore.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Read versionName
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Universal Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-log.txt

      - name: Publish build diagnostics
        if: always()
        run: |
          {
            echo "# Build diagnostics"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Errors"
            echo
            if [ -f build-log.txt ]; then
              grep -E "^e: |error: |FAILURE: |What went wrong|^Caused by: |Unresolved reference|Cannot find a symbol|Execution failed|> Task .* FAILED" build-log.txt | tail -n 200 || echo "(no error lines matched)"
              echo
              echo "## Tail"
              echo
              echo '```'
              tail -n 80 build-log.txt
              echo '```'
            else
              echo "(build-log.txt was not produced)"
            fi
          } > build-diagnostics.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B build-diagnostics
          git add -f build-diagnostics.md
          git commit -q -m "ci: update build diagnostics for $GITHUB_SHA" || true
          git push --force -q origin build-diagnostics

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResoMusic-v${{ steps.version.outputs.version }}-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Reso Music v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/*.apk